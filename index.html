<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Global Converter Station</title>
    <style>@font-face{font-family:'DirtyStains';src:url('DirtyStains-DEMO.otf') format('opentype')}html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;position:relative;background-color:#391E10!important;font-family:'DirtyStains',sans-serif!important;color:#E2CEB1;font-weight:700}.main-wrapper{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:20;gap:20px}#bgVisualizer{position:absolute;top:0;left:0;width:100vw!important;height:100vh!important;z-index:5;opacity:0.4;pointer-events:none}.hardware-rack{background-color:#734128;border-top:5px solid #a15d3b;border-bottom:5px solid #391E10;border-left:12px solid #2d180c;border-right:12px solid #2d180c;width:90vw;max-width:780px;padding:35px;box-sizing:border-box;box-shadow:inset 0 1px 0 rgba(255,255,255,0.05),0 25px 50px rgba(0,0,0,0.85);position:relative;display:flex;flex-direction:column;gap:30px;border-radius:6px}.hardware-rack::before,.hardware-rack::after{content:"⚙";position:absolute;color:#2d180c;font-size:20px;top:12px}.hardware-rack::before{left:14px}.hardware-rack::after{right:14px}.rack-header{display:flex;flex-direction:column;align-items:flex-start;border-bottom:2px dashed #391E10;padding-bottom:20px;gap:6px}.brand-title{font-size:34px;letter-spacing:2px;color:#E2CEB1;text-transform:uppercase}.model-subtitle{font-size:16px;color:#391E10;text-transform:uppercase;letter-spacing:1px}.rack-body{display:flex;flex-direction:column;gap:25px;width:100%;box-sizing:border-box}.rack-input{width:100%;background-color:#391E10;border:2px solid #2d180c;padding:22px;font-size:18px;color:#E2CEB1;font-family:inherit!important;box-sizing:border-box;border-radius:4px;text-shadow:0 0 2px rgba(226,206,177,0.3);text-align:center}.rack-input:focus{outline:none;border-color:#E2CEB1}.control-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:100%;box-sizing:border-box}.format-bay{display:flex;background:#391E10;padding:5px;border-radius:6px;border:2px solid #2d180c;justify-content:space-between;width:100%;box-sizing:border-box}.switch-btn,.action-trigger{font-family:inherit!important;text-transform:uppercase;cursor:pointer;transition:all .3s cubic-bezier(.16,1,.3,1)}.switch-btn{background:transparent;border:none;color:#734128;padding:14px 0;font-size:15px;border-radius:4px;flex:1;text-align:center}.switch-btn.active{background:#734128;color:#E2CEB1;box-shadow:inset 0 2px 4px rgba(0,0,0,0.4)}.switch-btn:hover{transform:translateY(-2px) scale(1.02);backdrop-filter:blur(10px);box-shadow:0 8px 20px rgba(0,0,0,0.3)}.action-trigger{background:#391E10;border:2px solid #2d180c;color:#E2CEB1;padding:14px 0;font-size:16px;border-radius:4px;box-shadow:0 5px 0 #2d180c;width:100%;text-align:center;box-sizing:border-box}.action-trigger:hover{transform:translateY(-3px) scale(1.02);backdrop-filter:blur(12px);box-shadow:0 12px 25px rgba(0,0,0,0.4),0 5px 0 #2d180c}.action-trigger:active{transform:translateY(3px);box-shadow:0 1px 0 #2d180c}.lcd-display{background-color:#391E10;border:2px solid #222a25;border-radius:4px;padding:18px;box-sizing:border-box;font-size:15px;color:#E2CEB1;text-shadow:0 0 2px rgba(226,206,177,0.5);text-align:center;font-family:inherit!important;width:100%}.preview-popup{display:none;background-color:#734128;border:2px solid #2d180c;border-radius:6px;width:90vw;max-width:780px;padding:25px;box-sizing:border-box;box-shadow:0 20px 40px rgba(0,0,0,0.7);animation:slideUp .4s cubic-bezier(.16,1,.3,1);flex-direction:column;align-items:center;gap:15px;text-align:center;height:auto!important;transition:all .3s ease}@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}.preview-thumb{width:180px;height:110px;object-fit:cover;border-radius:4px;border:2px solid #391E10;box-shadow:0 4px 10px rgba(0,0,0,0.3)}.preview-info{display:flex;flex-direction:column;align-items:center;gap:15px;width:100%;box-sizing:border-box}.track-title{font-size:16px;color:#E2CEB1;text-transform:uppercase;word-break:break-word;max-width:90%;margin:0 auto;line-height:1.4}.download-final-btn{background:#391E10;border:2px solid #2d180c;color:#E2CEB1;padding:14px 40px;font-size:16px;border-radius:4px;font-family:inherit!important;box-shadow:0 5px 0 #2d180c;cursor:pointer;transition:all .2s;text-transform:uppercase;display:inline-block;box-sizing:border-box;white-space:nowrap}.download-final-btn:hover{transform:translateY(-2px);backdrop-filter:blur(10px);box-shadow:0 8px 20px rgba(0,0,0,0.4),0 5px 0 #2d180c}.download-final-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2d180c}.progress-container{display:none;width:80%;max-width:400px;background-color:#391E10;border:2px solid #2d180c;border-radius:4px;padding:12px;font-size:16px;color:#E2CEB1;text-shadow:0 0 2px rgba(226,206,177,0.5);text-align:center;box-shadow:inset 0 0 8px rgba(0,0,0,0.5)}</style>
</head>
<body>
<canvas id="bgVisualizer"></canvas>
<div class="main-wrapper">
    <div class="hardware-rack">
        <div class="rack-header"><div class="brand-title">Global Converter Station</div><div class="model-subtitle">// Model-320WAV // High-Fidelity Audio Engine</div></div>
        <div class="rack-body">
            <input type="text" id="urlInput" class="rack-input" placeholder="[ ENTER SOURCE URL HERE... ]">
            <div class="control-row">
                <div class="format-bay"><button class="switch-btn active" onclick="setFormat('mp3')">MP3 320KBPS</button><button class="switch-btn" onclick="setFormat('wav')">WAV LOSSLESS</button></div>
                <button class="action-trigger" onclick="loadTrackInfo()">LOAD TRACK INFO</button>
            </div>
        </div>
        <div class="lcd-display" id="statusMessage">SYSTEM READY // ENGINE STANDBY</div>
    </div>
    <div class="preview-popup" id="previewPopup"><img class="preview-thumb" id="thumbImg" src="" alt="Thumbnail"><div class="preview-info"><div class="track-title" id="trackTitle">TRACK TITLE</div><button class="download-final-btn" id="dlFinalBtn" onclick="executeDownload()">DOWNLOAD AUDIO</button><div class="progress-container" id="progressBox">RENDERING: 0%</div></div></div>
</div>
<script>
    let selectedFormat='mp3';function setFormat(t){selectedFormat=t;document.querySelectorAll('.switch-btn').forEach(t=>t.classList.remove('active'));event.target.classList.add('active');document.getElementById('statusMessage').innerText=`FORMAT SWITCHED TO: ${t.toUpperCase()}`}
    async function loadTrackInfo(){const t=document.getElementById('urlInput').value,e=document.getElementById('statusMessage'),n=document.getElementById('previewPopup');if(!t){e.innerText="ERROR: SOURCE URL IS EMPTY.";return}e.innerText="FETCHING: EXTRACTING METADATA FROM SOURCE...";n.style.display="none";document.getElementById('dlFinalBtn').style.display="inline-block";document.getElementById('progressBox').style.display="none";try{const o=await fetch('/api/info',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:t})});if(!o.ok)throw new Error;const r=await o.json();document.getElementById('trackTitle').innerText=r.title;document.getElementById('thumbImg').src=r.thumbnail;n.style.display="flex";e.innerText="METADATA MOUNTED SUCCESSFUL."}catch(t){e.innerText="CRITICAL ERROR: CANNOT EXTRACT METADATA."}}
    async function executeDownload(){const t=document.getElementById('urlInput').value,e=document.getElementById('statusMessage'),dlBtn=document.getElementById('dlFinalBtn'),pBox=document.getElementById('progressBox');e.innerText="[TURBO START] DEPLOYING ENGINE...";dlBtn.style.display="none";pBox.style.display="block";let p=0;const interval=setInterval(()=>{if(p<95){p+=Math.floor(4*Math.random())+1;pBox.innerText=`RENDERING: ${p}%`}headerStatus(p)},180);function headerStatus(t){if(t<35)e.innerText="STREAMING: EXTRACTING AUDIO FROM SOURCE...";else if(t<75)e.innerText="CONVERTING: REMAPPING AUDIO FREQUENCY...";else e.innerText="EXPORTING: ENCODING STUDIO METADATA..."}
        try{const n=await fetch('/api/convert',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:t,format:selectedFormat})});if(!n.ok)throw new Error;clearInterval(interval);pBox.innerText="RENDERING: 100%";const o=n.headers.get('Content-Disposition');let r=`GlobalConverter-${Date.now()}.${selectedFormat}`;if(o){const t=o.match(/filename="(.+)"/);if(t)r=t}const c=await n.blob(),a=window.URL.createObjectURL(c),i=document.createElement('a');i.href=a;i.download=decodeURIComponent(r);document.body.appendChild(i);i.click();i.remove();e.innerText="SUCCESS: AUDIO EXPORT COMPLETE."}catch(t){clearInterval(interval);pBox.style.display="none";dlBtn.style.display="inline-block";e.innerText="CRITICAL ERROR: CONVERSION FAILED."}}
    const canvas=document.getElementById('bgVisualizer'),ctx=canvas.getContext('2d');function forceResize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}forceResize();window.addEventListener('resize',forceResize);const pointsCount=60;let currentPoints=new Array(pointsCount).fill(0),targetPoints=new Array(pointsCount).fill(0);
    function startLoop60FPS(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.beginPath();ctx.lineWidth=4;ctx.strokeStyle='#E2CEB1';ctx.shadowBlur=12;ctx.shadowColor='#E2CEB1';ctx.lineCap='round';ctx.lineJoin='round';for(let t=0;t<pointsCount;t++){if(Math.random()>.96){targetPoints[t]=.35*canvas.height*Math.random()+30}currentPoints[t]+=.03*(targetPoints[t]-currentPoints[t]);targetPoints[t]*=.96;const e=canvas.width/(pointsCount-1)*t,customY=canvas.height/2+.5*Math.sin(.2*t)*currentPoints[t];if(0===t)ctx.moveTo(e,customY);else ctx.lineTo(e,customY)}ctx.stroke();ctx.shadowBlur=0;requestAnimationFrame(startLoop60FPS)}startLoop60FPS();
</script>
</body>
</html>
